persistence:
  enabled: false
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {memory: 256Mi}
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        access: proxy
        isDefault: true
