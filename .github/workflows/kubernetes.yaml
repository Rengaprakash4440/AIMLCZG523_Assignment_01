name: Kubernetes Deployments

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Configure AWS and Kubernetes
    runs-on: self-hosted

    env:
      AWS_REGION: ap-south-1
      EKS_CLUSTER_NAME: heart-mlops

    steps:
      # Step 1: Configure AWS credentials
      - name: Configure AWS CLI
        if: github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          sudo aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          sudo aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          sudo aws configure set region "$AWS_REGION"
          sudo aws configure set output json

          sudo aws sts get-caller-identity

      # Step 2: Verify AWS CLI and kubectl
      - name: Verify CLI Tools
        if: github.event_name != 'pull_request'
        run: |
          sudo aws --version
          sudo kubectl version --client

      # Step 3: Configure EKS kubeconfig
      - name: Kubernetes Setup
        if: github.event_name != 'pull_request'
        run: |
          sudo aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # Step 4: Verify Kubernetes connection
      - name: Verify Kubernetes Cluster
        if: github.event_name != 'pull_request'
        run: |
          sudo kubectl cluster-info
          sudo kubectl get nodes

      - name: Verify Kubernetes Cluster
        if: github.event_name != 'pull_request'
        run: |
          sudo kubectl apply -f kubernetes/namespaces.yaml
          sudo kubectl apply -f kubernetes/deployment.yaml
          sudo kubectl apply -f kubernetes/service.yaml
          sudo kubectl apply -f kubernetes/network-policy.yaml

     # Running via Docker is the cleanest way to install and run ZAP without managing Java dependencies
      - name: Pull OWASP ZAP Docker Image
        run: sudo docker pull zaproxy/zap-stable:latest

      # Step 9: Verify target URL
      - name: Verify Application URL
        env:
          TARGET_URL: ${{ vars.ZAP_TARGET_URL }}
        run: |
          set -eu

          if [ -z "$TARGET_URL" ]; then
            echo "ERROR: Configure the ZAP_TARGET_URL repository variable."
            exit 1
          fi

          echo "Checking application connectivity..."

          curl -sS \
            --connect-timeout 10 \
            --max-time 30 \
            -o /dev/null \
            "$TARGET_URL"

          echo "Application endpoint is reachable."

      # Step 10: Run OWASP ZAP baseline scan
      - name: Run OWASP ZAP Baseline Scan
        env:
          TARGET_URL: ${{ vars.ZAP_TARGET_URL }}
        run: |
          set -eu

          mkdir -p "$GITHUB_WORKSPACE/zap-reports"

          sudo docker run --rm \
            -v "$GITHUB_WORKSPACE/zap-reports:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "$TARGET_URL" \
            -m 3 \
            -T 5 \
            -r zap-report.html \
            -J zap-report.json \
            -I

      # Step 11: Upload reports even when scanning fails
      - name: Upload OWASP ZAP Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-zap-reports
          path: zap-reports/
          if-no-files-found: warn
          retention-days: 7

      


