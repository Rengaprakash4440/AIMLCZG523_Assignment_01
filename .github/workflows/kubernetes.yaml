name: Kubernetes Deployments

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Configure AWS and Kubernetes
    runs-on: self-hosted

    env:
      AWS_REGION: ap-south-1
      EKS_CLUSTER_NAME: heart-mlops

    steps:
      # Step 1: Configure AWS credentials
      - name: Configure AWS CLI
        if: github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          sudo aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          sudo aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          sudo aws configure set region "$AWS_REGION"
          sudo aws configure set output json

          sudo aws sts get-caller-identity

      # Step 2: Verify AWS CLI and kubectl
      - name: Verify CLI Tools
        if: github.event_name != 'pull_request'
        run: |
          sudo aws --version
          sudo kubectl version --client

      # Step 3: Configure EKS kubeconfig
      - name: Kubernetes Setup
        if: github.event_name != 'pull_request'
        run: |
          sudo aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      # Step 4: Verify Kubernetes connection
      - name: Verify Kubernetes Cluster
        if: github.event_name != 'pull_request'
        run: |
          sudo kubectl cluster-info
          sudo kubectl get nodes

      - name: Verify Kubernetes Cluster
        if: github.event_name != 'pull_request'
        run: |
          sudo kubectl apply -f kubernetes/namespaces.yaml
          sudo kubectl apply -f kubernetes/deployment.yaml
          sudo kubectl apply -f kubernetes/service.yaml
          sudo kubectl apply -f kubernetes/network-policy.yaml

     # Running via Docker is the cleanest way to install and run ZAP without managing Java dependencies
      - name: Pull OWASP ZAP Docker Image
        run: sudo docker pull zaproxy/zap-stable:latest

      - name: Run OWASP ZAP Baseline Scan
        run: |
          sudo docker run --rm -v $(pwd):/zap/wrk/:rw -t zaproxy/zap-stable zap-baseline.py \
            -t http://localhost:3000 \
            -r zap_report.html
