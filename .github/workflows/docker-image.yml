
name: Build, Trivy scan and ECR push

# Reusable workflow called by the main MLOps pipeline.
# Can also be executed manually.
on:
  workflow_call:
    outputs:
      image:
        description: Full ECR image URI successfully pushed
        value: ${{ jobs.build.outputs.image }}
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: heart-api

jobs:
  build:
    name: Build, scan, push
    runs-on: self-hosted
    timeout-minutes: 45

    outputs:
      image: ${{ steps.push.outputs.image }}

    steps:
      # ----------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # 2. Build image with a unique commit tag
      # ----------------------------------------------------
      - name: Build Docker image
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_IMAGE="heart:${GITHUB_SHA}"

          echo "Building ${LOCAL_IMAGE}"

          sudo docker build \
            --pull \
            -f dockerfiles/Dockerfile \
            --build-arg PYTHON_VERSION="${PYTHON_VERSION}" \
            -t "${LOCAL_IMAGE}" \
            .

          sudo docker image inspect "${LOCAL_IMAGE}" \
            --format 'Built image ID: {{.Id}}'

      # ----------------------------------------------------
      # 3. Security gate: block vulnerable images
      # ----------------------------------------------------
      - name: Trivy image scan (security gate)
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_IMAGE="heart:${GITHUB_SHA}"

          echo "Scanning ${LOCAL_IMAGE}"

          sudo trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            --no-progress \
            "${LOCAL_IMAGE}" 2>&1 | tee trivy.log

          echo "Trivy security gate passed."

      # ----------------------------------------------------
      # 4. Preserve evidence even if scan fails
      # ----------------------------------------------------
      - name: Upload Trivy security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy.log
          if-no-files-found: warn

      # ----------------------------------------------------
      # 5. Verify AWS identity and prepare ECR URI
      # ----------------------------------------------------
      - name: Verify AWS identity and compute image URI
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

          echo "Target ECR image: ${IMAGE_URI}"

      # ----------------------------------------------------
      # 6. Authenticate Docker to Amazon ECR
      # ----------------------------------------------------
      - name: Login to Amazon ECR
        shell: bash
        run: |
          set -euo pipefail

          aws ecr get-login-password \
            --region "${AWS_REGION}" \
            | sudo docker login \
                --username AWS \
                --password-stdin "${ECR_REGISTRY}"

      # ----------------------------------------------------
      # 7. Push only after all security checks pass
      # ----------------------------------------------------
      - name: Tag and push verified image
        id: push
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_IMAGE="heart:${GITHUB_SHA}"

          sudo docker tag \
            "${LOCAL_IMAGE}" \
            "${IMAGE_URI}"

          sudo docker push "${IMAGE_URI}"

          echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

          echo "Successfully pushed ${IMAGE_URI}"
