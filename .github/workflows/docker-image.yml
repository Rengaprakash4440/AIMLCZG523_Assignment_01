name: Docker Image Building, Trivy Scan and ECR Push

on:
  workflow_call:
     outputs:
       image: 
         description: "Full ECR image URI (registry/repo:tag) that was pushed"
         value: ${{ jobs.build.outputs.image }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Scan and Push to ECR
    runs-on: self-hosted

    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: heart-api

    steps:
      
      - name: Checkout Repository
        uses: actions/checkout@v4

      
      - name: Build Docker Image
        run: |
          sudo docker build \
            -f dockerfiles/Dockerfile \
            -t heart:latest .

     
      - name: Install Trivy
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wget gnupg

            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
              | gpg --dearmor \
              | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

            echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
              | sudo tee /etc/apt/sources.list.d/trivy.list

            sudo apt-get update
            sudo apt-get install -y trivy
          else
            echo "Trivy is already installed."
          fi

     
      - name: Trivy Image Scan
        run: |
          sudo trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            heart:latest

     
      - name: Get ECR Registry
        if: github.event_name != 'pull_request'
        run: |
          ACCOUNT_ID=$(sudo aws sts get-caller-identity \
            --query Account \
            --output text)

          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "ECR_REGISTRY=$ECR_REGISTRY" >> "$GITHUB_ENV"

     
      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        run: |
         sudo aws ecr get-login-password \
            --region "$AWS_REGION" \
            | sudo docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

    
      - name: Tag Docker Image
        if: github.event_name != 'pull_request'
        run: |
          sudo docker tag heart:latest \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"

     
      - name: Push Docker Image to ECR
        if: github.event_name != 'pull_request'
        run: |
          sudo docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
