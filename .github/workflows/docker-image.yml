name: Docker Image Building, Trivy Scan and ECR Push

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Scan and Push to ECR
    runs-on: self-hosted

    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: heart-api

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Build Docker image
      - name: Build Docker Image
        run: |
          sudo docker build \
            -f dockerfiles/Dockerfile \
            -t heart:latest .

      # Step 3: Install Trivy if missing
      - name: Install Trivy
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wget gnupg

            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
              | gpg --dearmor \
              | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

            echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
              | sudo tee /etc/apt/sources.list.d/trivy.list

            sudo apt-get update
            sudo apt-get install -y trivy
          else
            echo "Trivy is already installed."
          fi

      # Step 4: Scan image before pushing
      - name: Trivy Image Scan
        run: |
          sudo trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            heart:latest

      # Step 5: Configure AWS credentials using CLI
      - name: Configure AWS CLI
        if: github.event_name != 'pull_request'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          sudo aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
          sudo aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
          sudo  aws configure set region "$AWS_REGION"
          sudo aws configure set output json

          sudo aws sts get-caller-identity

      # Step 6: Get AWS account ID and ECR registry
      - name: Get ECR Registry
        if: github.event_name != 'pull_request'
        run: |
          ACCOUNT_ID=$(sudo aws sts get-caller-identity \
            --query Account \
            --output text)

          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "ECR_REGISTRY=$ECR_REGISTRY" >> "$GITHUB_ENV"

      # Step 7: Login to ECR using AWS CLI
      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        run: |
         sudo aws ecr get-login-password \
            --region "$AWS_REGION" \
            | sudo docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

      # Step 8: Tag image for ECR
      - name: Tag Docker Image
        if: github.event_name != 'pull_request'
        run: |
          sudo docker tag heart:latest \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"

          sudo docker tag heart:latest \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      # Step 9: Push image to ECR
      - name: Push Docker Image to ECR
        if: github.event_name != 'pull_request'
        run: |
          sudo docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"

          sudo docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
