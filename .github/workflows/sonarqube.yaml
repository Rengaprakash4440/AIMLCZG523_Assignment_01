name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Analyze
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Use the EC2 instance profile for AWS credentials.
      # No OIDC role assumption is required.
      - name: Verify AWS Identity
        run: sudo aws sts get-caller-identity

      # Retrieve SonarQube secrets from AWS Secrets Manager
      - name: Get SonarQube Secrets
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            SONAR,sonarqube/github-actions
          parse-json-secrets: true

      # Run SonarQube Scan
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ env.SONAR_SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_SONAR_HOST_URL }}

      # Check Quality Gate
      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ env.SONAR_SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_SONAR_HOST_URL }}
