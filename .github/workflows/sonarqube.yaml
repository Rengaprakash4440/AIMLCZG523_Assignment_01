name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Analyze
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Verify AWS credentials from the EC2 instance profile
      - name: Verify AWS Identity
        run: sudo aws sts get-caller-identity

      # Retrieve SonarQube secrets from AWS Secrets Manager
      - name: Get SonarQube Secrets
        shell: bash
        run: |
          set -euo pipefail

          SECRET_JSON=$(sudo aws secretsmanager get-secret-value \
            --secret-id "arn:aws:secretsmanager:ap-south-1:466217811358:secret:MYSECRETS-JWHSYV" \
            --region ap-south-1 \
            --query SecretString \
            --output text)

          SONAR_TOKEN=$(echo "$SECRET_JSON" | jq -r '.SONARCUBE_KEY')
          SONAR_HOST_URL=$(echo "$SECRET_JSON" | jq -r '.SONARCUBE_HOST')

          if [[ -z "$SONAR_TOKEN" || "$SONAR_TOKEN" == "null" ||
                -z "$SONAR_HOST_URL" || "$SONAR_HOST_URL" == "null" ]]; then
            echo "Required SonarQube secrets are missing."
            exit 1
          fi

          echo "::add-mask::$SONAR_TOKEN"
          echo "::add-mask::$SONAR_HOST_URL"

          {
            echo "SONAR_TOKEN=$SONAR_TOKEN"
            echo "SONAR_HOST_URL=$SONAR_HOST_URL"
          } >> "$GITHUB_ENV"

      # Run SonarQube Scan
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      # Check SonarQube Quality Gate
      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Checkov Security Scan
        run: |
          checkov --file Dockerfile --framework dockerfile
          checkov -d k8s --framework kubernetes
