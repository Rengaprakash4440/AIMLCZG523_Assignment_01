name: MLOps Pipeline

# Orchestrator. Calls the separate workflow files in order:
#   ml-pipeline -> quality-security -> build-push -> deploy -> zap-scan
# Pull requests run only the ML job; everything that touches the self-hosted
# VM, ECR or EKS runs on push to main or manual dispatch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mlops-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ml:
    name: ML pipeline
    uses: ./.github/workflows/ml_pipeline.yml

  quality:
    name: SonarQube and Checkov
    needs: [ml]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/sonarqube.yaml

  build:
    name: Build, Trivy, ECR push
    needs: [ml, quality]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/docker-image.yml

  deploy:
    name: Deploy to EKS
    needs: [ml, quality, build]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/kubernetes.yaml
    with:
      image: ${{ needs.build.outputs.image }}

  zap:
    name: OWASP ZAP scans
    needs: [ml, quality, build, deploy]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/zap.yml
    with:
      url: ${{ needs.deploy.outputs.url }}