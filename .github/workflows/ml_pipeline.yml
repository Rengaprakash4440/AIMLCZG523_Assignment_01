name: ML Pipeline

on:
  workflow_call:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14"   

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt 

      - name: Lint (flake8)
        run: flake8 src tests | tee flake8.log

      - name: Unit tests (pytest)
        run: pytest -v --junitxml=pytest-report.xml --cov=src --cov-report=xml --cov-report=term-missing

      - name: Dataset preparation
        run: |
          python -m src.download_data
          python -c "from src.data import load_clean; load_clean().to_csv('data/heart_clean.csv', index=False)"
          git diff --exit-code data/heart_clean.csv && echo "Prepared dataset matches the committed copy"

      - name: Exploratory analysis (headless notebook)
        run: |
          jupyter nbconvert --to notebook --execute report/notebooks/01_eda.ipynb \
            --output executed_eda.ipynb --output-dir report/

      - name: Train and track experiments (MLflow)
        run: python -m src.train 2>&1 | tee train.log

      - name: Model comparison
        run: |
          python - <<'EOF'
          import mlflow
          mlflow.set_tracking_uri("sqlite:///mlflow.db")
          runs = mlflow.search_runs(experiment_names=["heart-disease"])
          cols = ["tags.mlflow.runName", "metrics.cv_roc_auc", "metrics.test_roc_auc",
                  "metrics.test_recall", "metrics.test_precision", "metrics.test_accuracy"]
          df = runs[cols].sort_values("metrics.cv_roc_auc", ascending=False)
          df.to_csv("model_comparison.csv", index=False)
          print(df.to_string(index=False))
          EOF

      - name: Reproducibility check
        run: |
          pip freeze > environment-lock.txt
          cp models/metadata.json /tmp/metadata_run1.json
          python -m src.train > /dev/null 2>&1
          diff /tmp/metadata_run1.json models/metadata.json && echo "Two seeded runs gave identical results"

      - name: Upload coverage report for SonarQube
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

      - name: Upload reports and ML artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-pipeline-artifacts
          path: |
            flake8.log
            pytest-report.xml
            coverage.xml
            models/
            data/heart_clean.csv
            report/executed_eda.ipynb
            report/figures/
            model_comparison.csv
            environment-lock.txt
            mlflow.db
            train.log
