apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: heart-api-network-policy
  namespace: heartbeat-api
spec:
  podSelector:
    matchLabels:
      app: heart-api

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: heartbeat-api
      ports:
        - protocol: TCP
          port: 8000
